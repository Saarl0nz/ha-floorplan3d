name: Release aus manifest.json

# Legt automatisch ein Release mit der Versionsnummer aus manifest.json an,
# sobald manifest.json geändert wird. HACS zeigt dann z. B. "1.7.0" statt eines Commit-Kürzels.
on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "Version: $VERSION"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION existiert bereits."
            exit 0
          fi
          NOTES=$(awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md 2>/dev/null || true)
          [ -z "$NOTES" ] && NOTES="Version $VERSION"
          gh release create "$VERSION" --title "$VERSION" --notes "$NOTES" --target "$GITHUB_SHA"
